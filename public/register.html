<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | KAKESA</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a href="/" class="brand"><span class="brand-icon">K</span><span>KAKESA</span></a>
            <h1>Create your account</h1>
            <p>Join your organization’s meeting workspace.</p>
            <form id="authForm" data-mode="register" class="stack">
                <div class="field">
                    <label for="fullName">Full name</label>
                    <input id="fullName" name="fullName" autocomplete="name" minlength="2" maxlength="150" required>
                </div>
                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
                </div>
                <div class="field">
                    <label for="password">Password (10 characters minimum)</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
                </div>
                <button class="btn btn-primary" type="submit">Create account</button>
            </form>
            <p id="authMessage" class="message" role="status"></p>
            <p>Already registered? <a href="/login.html">Sign in</a></p>
        </section>
    </main>
    <script src="/assets/js/auth-page.js" defer></script>
</body>
</html>
